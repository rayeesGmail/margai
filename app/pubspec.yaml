name: margai
description: "MARG AI — AI mentor app for NEET (Android first). Contract: docs/SPEC.md."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  # 11.x compiles against Android 17, which the SDK ships only as the minor-versioned platform
  # android-37.0; AGP 9.1.0 cannot resolve that hash. Stay on 10.x (compileSdk 36, Flutter's own
  # default) until the Flutter template bumps compileSdk (DECISIONS 2026-09-09, D8).
  flutter_secure_storage: ^10.3.1
  go_router: ^18.0.1
  intl: any
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # ARB strings in lib/l10n (en, hi, hi_Latn); generated into lib/l10n/app_localizations*.dart (l10n.yaml).
  generate: true
