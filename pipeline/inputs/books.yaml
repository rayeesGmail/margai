# NCERT books for `ncert register|render|extract|load` (D14–D16). TECH_PLAN §6.2, §2.3
# (ncert_books), SPEC §9 item 2. Founder-owned: the pipeline reads this file and never writes it.
#
# One entry per book, both editions on it. `source` is the book's PREFIX in the content bucket —
# NCERT publishes chapter-wise PDFs, not one file per book — and `chapters` maps each PDF to the
# chapter number printed in the book. That mapping is the reason this list is explicit rather than
# derived: a Part-II folder numbers its files from 01 while its chapters start at 8
# (keph201.pdf = Chapter 8), and NTA, the syllabus and every anchor a student sees mean the
# printed number (SPEC §6.3 "Class 11 Physics, Ch 7, §7.9").
#
# `subject` is the book's, so Biology is one book while the taxonomy splits it into botany and
# zoology; paragraphs reach that split through node_id at the D23 anchor pass (DECISIONS D14).
#
# Prelims (*ps), answers (*an) and appendices (*a1) are deliberately absent: they carry no
# paragraph a student anchors to. `title_hi` is absent everywhere until a native reader supplies
# it — the ten Hindi books are legacy Chanakya glyph text with no Unicode map (TRACKER PARKED
# 2026-09-09), which is also why nothing renders or extracts `hi` before D16.
#
# Editions and reprints are recorded in ncert/2022-ed/{en,hi}/manifest.md, checked against each
# book's own edition page on 2026-09-09; edition_year is the "Revised" year from that line.
books:
  - code: phy11-part1
    subject: physics
    class_level: 11
    part: 1
    title_en: "Physics Part-I, Textbook for Class XI"
    edition_year: 2022
    source:
      en: source/ncert/2022-ed/en/phy11-part1/
      hi: source/ncert/2022-ed/hi/phy11-part1/
    chapters:
      - {no: 1, en: keph101.pdf, hi: khph101.pdf}
      - {no: 2, en: keph102.pdf, hi: khph102.pdf}
      - {no: 3, en: keph103.pdf, hi: khph103.pdf}
      - {no: 4, en: keph104.pdf, hi: khph104.pdf}
      - {no: 5, en: keph105.pdf, hi: khph105.pdf}
