# ncert-corrections.yaml — the founder's rulings on what `ncert verify` flagged (D15).
#
# `ncert load` applies every entry for the book, edition and chapters it loads, after its own
# page-break repairs and before it numbers paragraphs, and names each one in its report. An entry
# that cannot be applied fails the load by name and nothing is written. See the README beside this
# file and docs/runbooks/ncert-ingest.md, "5. verify".
#
# Every entry: book, lang, chapter, page (within the chapter's PDF), kind, reason; address optional,
# for the reader only. Quote any value that contains a comma, a colon or a leading symbol.
#
#   kind: text            transcribed + printed — the span must occur exactly once on the page
#   kind: join            at — the words a paragraph starts with; it is the rest of the one before
#   kind: split           at — a span occurring once on the page; a new paragraph starts there
#   kind: figure_ref      at — a span once on the page naming the paragraph; remove OR add — one label
#   kind: drop            at — the words a paragraph starts with; it is not running text and goes
#   kind: misprint        transcribed + printed as the verifier quoted them — the book's own error, kept
#   kind: false_positive  transcribed + printed as the verifier quoted them — the verifier was wrong
#
# Example:
#   - {book: phy11-part1, lang: en, chapter: 7, page: 4, kind: text, address: "ch 7 §7.3 ¶5",
#      transcribed: "|r|^3 r_hat", printed: "|r|^3 r", reason: "the third form prints the vector r"}
corrections:
  # phy11-part1 chapter 7, Opus run 11 — the free checks of the 2026-09-15 calibration, each read against
  # the page rendered at 170–220 DPI; approved by the founder 2026-09-15 (ruling 4). Each line is indented
  # after a displayed equation, which the transcriber's own prompt (ncert_extract v3) says starts a paragraph.
  - {book: phy11-part1, lang: en, chapter: 7, page: 3, kind: split, address: "ch 7 §7.2 ¶7",
     at: "where v is the velocity", reason: "indented after the display (7.2)"}
  - {book: phy11-part1, lang: en, chapter: 7, page: 7, kind: split, address: "ch 7 §7.6 ¶3",
     at: "For h/R_E << 1, using binomial expression", reason: "indented after the display for g(h)"}
  - {book: phy11-part1, lang: en, chapter: 7, page: 8, kind: split, address: "ch 7 §7.6 ¶7",
     at: "Substituting for M_s from above", reason: "indented after the display (7.17)"}
  - {book: phy11-part1, lang: en, chapter: 7, page: 11, kind: split, address: "ch 7 §7.9 ¶4",
     at: "where we have used the relation", reason: "indented after the display (7.36)"}
  # The fifth free-check finding of the same calibration, and the second read's two remaining signals, both
  # read against the rendered page and scored wrong on 2026-09-15; approved by the founder 2026-09-16 (ruling 1).
  - {book: phy11-part1, lang: en, chapter: 7, page: 4, kind: figure_ref, address: "ch 7 §7.3 ¶9",
     at: "Three equal masses of m kg each", remove: "Fig. 7.5",
     reason: "Example 7.2's stem names no figure; the figure belongs to part (b), which carries it too"}
  - {book: phy11-part1, lang: en, chapter: 7, page: 10, kind: false_positive, address: "ch 7 §7.8 ¶10",
     printed: "R_E replaced by the radius", transcribed: "r_E replaced by the radius",
     reason: "the page prints r_E — the verifier corrected the book"}
  - {book: phy11-part1, lang: en, chapter: 7, page: 12, kind: false_positive, address: "ch 7 §7.10 ¶4",
     printed: "total energy of a satellite", transcribed: "total energy of an circularly orbiting satellite",
     reason: "the page prints \"an circularly orbiting\" — the verifier invented the shorter phrase"}
  # The two flags of the 2026-09-16 re-read of pages 3, 7, 8 and 11, each read against the page rendered at
  # 3× (page 8's text layer is private-use encoded, so only the image can say); approved by the founder the
  # same evening. Both are the book's own grammar, which the verifier repaired silently — its habit.
  - {book: phy11-part1, lang: en, chapter: 7, page: 7, kind: misprint, address: "ch 7 §7.6 ¶7",
     printed: "proportional to the cube", transcribed: "proportional to be cube",
     reason: "the page prints \"to be cube\" — the book's own error, kept"}
  - {book: phy11-part1, lang: en, chapter: 7, page: 8, kind: misprint, address: "ch 7 §7.6 ¶11",
     printed: "acceleration due to gravity decreases", transcribed: "acceleration due gravity decreases",
     reason: "the page prints \"due gravity\" — the book's own error, kept"}
