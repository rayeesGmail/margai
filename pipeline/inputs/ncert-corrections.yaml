  - {book: chem11-part1, lang: en, chapter: 2, page: 19, kind: text, address: "ch 2 §2.4 ¶12",
     transcribed: "This representation is called an energy level diagram.", printed: "This representation is called an energy level diagram. What does the negative electronic energy (E_n) for hydrogen atom mean? The energy of the electron in a hydrogen atom has a negative sign for all possible orbits (eq. 2.13). What does this negative sign convey? This negative sign means that the energy of the electron in the atom is lower than the energy of a free electron at rest. A free electron at rest is an electron that is infinitely far away from the nucleus and is assigned the energy value of zero. Mathematically, this corresponds to setting n equal to infinity in the equation (2.13) so that E_∞ = 0. As the electron gets closer to the nucleus (as n decreases), E_n becomes larger in absolute value and more and more negative. The most negative energy value is given by n=1 which corresponds to the most stable orbit. We call this the ground state.", reason: "the page prints the explanatory box \"What does the negative electronic energy (En) for hydrogen atom mean?\" in the right column; the transcriber skipped it whole. It explains (eq. 2.13), so it is running text (prompt: a box that reads as part of the chapter's explanation is kept); its title leads it (2026-09-28). Text from the page's layer, in the prompt's notation; the split below makes it its own paragraph"}
