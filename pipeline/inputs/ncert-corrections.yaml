  - {book: phy11-part2, lang: hi, chapter: 10, page: 19, kind: text, address: "ch 10 §10.10 ¶2",
     transcribed: "इसका अध्ययन करने के लिए आइए निम्नलिखित क्रियाकलाप करें।", printed: "इसका अध्ययन करने के लिए आइए निम्नलिखित क्रियाकलाप करें। क्रियाकलाप 10.4 एक विडोलक सहित ऊष्मामापी में कुछ जल, मान लें 300 mL लीजिए और इसे दो छिद्र वाले ढक्कन से ढक दीजिए। ढक्कन के एक छिद्र में विडोलक तथा दूसरे छिद्र में तापमापी लगाइए तथा यह सुनिश्चित कीजिए कि तापमापी का बल्ब जल में डूब जाए। तापमापी का पाठ्यांक नोट कीजिए। यह पाठ्यांक T_1 परिवेश का ताप है। ऊष्मामापी के जल को इतना गर्म कीजिए कि इसका ताप कक्ष ताप (अर्थात् परिवेश के ताप) से लगभग 40 °C अधिक तक पहुँच जाए। तत्पश्चात् ऊष्मा स्रोत को हटाकर जल को गर्म करना बंद कीजिए। विराम घड़ी चलाइए तथा प्रत्येक नियत समय अंतराल जैसे 1 मिनट के पश्चात् विडोलक से धीरे-धीरे विडोलित करते हुए तापमापी के पाठ्यांक नोट कीजिए। जल का ताप परिवेश के ताप से लगभग 5 °C अधिक रहने तक पाठ्यांक नोट करते रहिए। मान लीजिए यह पाठ्यांक (T_2) है। तत्पश्चात् ताप Delta T = T_2 – T_1 को y-अक्ष के अनुदिश लेकर इसके प्रत्येक मान के लिए तदनुरूपी t के मान को x-अक्ष के अनुदिश लेकर ग्राफ आलेखित करिए (चित्र 10.19)।", reason: "the क्रियाकलाप 10.4 box the page prints in the right column (crop p19 x285-570 y375-665, read at zoom 4), the English §10.10 ¶2; both reads of the page (2026-10-09, 2026-10-11) left it out, so it is typed from the page image by the founder's ruling of 2026-10-11, its title leading as a box's does (2026-09-28); the decoded layer's right-column lines y386-y598 agree word for word"}
