# ncert-corrections.yaml — the founder's rulings on what `ncert verify` flagged (D15), and since D16 the
# `lang: hi` entries that join and split a Hindi book's paragraphs to its canonical English rows.
#
# `ncert load` applies every entry for the book, edition and chapters it loads, after its own
# page-break repairs and before it numbers paragraphs (a `move` it carries out on the numbered rows, once
# page breaks are joined), and names each one in its report. An entry
# that cannot be applied fails the load by name and nothing is written. See the README beside this
# file and docs/runbooks/ncert-ingest.md, "5. verify".
#
# Every entry: book, lang, chapter, page (within the chapter's PDF), kind, reason; address optional,
# for the reader only. Quote any value that contains a comma, a colon or a leading symbol.
#
# A `lang: hi` entry that changes the rows is written against them as the load shows them: the load puts
# back the visargas the transcriber wrote as colons (अत: → अतः) before it applies an entry (D16). A
# misprint or false_positive quotes the verifier's spans as its report gave them. A Hindi reason cites
# the decoded text layer by position only and never quotes it (SPEC §12.2: a check, never stored).
#
#   kind: text            transcribed + printed — the span must occur exactly once on the page
#   kind: join            at — the words a paragraph starts with; it is the rest of the one before
#   kind: split           at — a span occurring once on the page; a new paragraph starts there
#   kind: figure_ref      at — a span once on the page naming the paragraph; remove OR add — one label
#   kind: drop            at — the words a paragraph starts with; it is not running text and goes
#   kind: defer           at — the words a paragraph starts with; it takes its number after the next
#                         paragraph of its section (a footnote the other edition prints a page later)
#   kind: section         at + section — the words the first paragraph under a heading starts with, and the
#                         section the English numbers it, quoted; that section's paragraphs in the chapter
#                         all take it (Hindi only: a heading the Hindi print numbers otherwise)
#   kind: move            at + after + after_page — the words a row starts with, and the words of the row it is
#                         numbered right after (which starts on after_page), in that row's section; applied to
#                         whole rows once page breaks are joined (Hindi only: a footnote or box the Hindi
#                         prints away from where the English numbers it)
#   kind: misprint        transcribed + printed as the verifier quoted them — the book's own error, kept (in
#                         a Hindi row where it states something false, a text entry writes the meaning)
#   kind: false_positive  transcribed + printed as the verifier quoted them — the verifier was wrong
#   kind: noise           flag (join or figure) + at — one of the free checks was wrong about the paragraph
#                         starting there; the row leaves the flag behind and counts clean
#
# Example:
#   - {book: phy11-part1, lang: en, chapter: 7, page: 4, kind: text, address: "ch 7 §7.3 ¶5",
#      transcribed: "|r|^3 r_hat", printed: "|r|^3 r", reason: "the third form prints the vector r"}
