# Section titles for `ncert embed --context section` (D15 experiment).
#
# Harvested at zero cost from each chapter PDF's own text layer, then filtered against the
# section numbers the corpus actually carries — NCERT numbers its end-of-chapter exercises
# the same way it numbers sections (`1.7`, `5.12`), and a decimal in running text (`27.3
# days`) reads the same again, so an unfiltered harvest invents sections that do not exist.
#
# Two titles wrap across a line in a shape the harvest does not rejoin and were completed by hand
# against the printed page: 3.4 ("… vectors - graphical method") and 4.11 ("… mechanics").
#
# Founder-owned like every other file here: the pipeline reads it and never writes it.
