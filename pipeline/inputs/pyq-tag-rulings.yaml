# The founder's rulings on PYQ tags (D19; DECISIONS 2026-10-21). Founder-owned: Claude drafts entries from the
# founder's rulings and the tag review, the founder approves them, and the pipeline only reads this file
# (.claude/rules/pipeline.md). `pyq load --paper` puts a paper's rulings in place of the model's tags — the question
# is stored with `tag_status = founder` and both tags kept in its provenance — and `pyq tag` reports each ruling
# beside the model's tag. A ruling replaces the whole tag: a field it leaves out is empty, never the model's.
#
# Per paper: `code`, the register's (pipeline/inputs/pyq-papers.yaml) — a code the register lacks is refused, so a
# typo cannot leave rulings unapplied; `approved_file_sha256`, the sha256 of the approved paper file
# (pipeline/inputs/papers/<code>.json) the rulings were made against — once that file changes, `pyq tag` and
# `pyq load` refuse the paper's rulings until each is confirmed against the new file and this line is updated, so a
# ruling on a question since corrected is never applied unread (Claude fills it); and one entry per ruled question:
#   question         the question number as printed
#   primary          the topic or chapter code of pipeline/inputs/taxonomy.csv the question tests
#   secondary        at most two further codes it needs (optional)
#   out_of_syllabus  true only when its topic is absent from both the current NMC syllabus and the current NCERT
#                    books (SPEC §7.1); false unless set
#   anchor           where NCERT teaches it, as `<book> ch <n> §<section> ¶<para>` where D20 is to ground on it — in
#                    the other subject's book too (DECISIONS 2026-10-23); `none` marks "no NCERT anchor" — a topic the
#                    NMC syllabus lists that the current textbooks do not teach, cut or never taught — and no AI solution
#                    is written for it (hard rule 2; DECISIONS); `pending` marks "not yet in the corpus" — a topic
#                    printed in the current book but not yet held in the app (a table, a figure, or pages not yet
#                    ingested) — and D20 skips it until that material comes in (DECISIONS 2026-10-23) (optional)
#   gap              a taxonomy node proposed for it where none fits, code and name — the taxonomy-gap list
#                    (optional; the founder rules on each before it goes into taxonomy.csv)
#   ruled            the date of the founder's ruling
#   note             the ruling, in a line

