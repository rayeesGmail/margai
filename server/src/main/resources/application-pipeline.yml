# pipeline profile (TECH_PLAN §1.2, §6.1): the founder's laptop runs one §6 content command —
# `java -jar server.jar --spring.profiles.active=pipeline <command>` — and the JVM exits with its
# code. No HTTP server; the production Flyway locations only, so the db/seed test taxonomy never
# meets a real load. Live model calls need the live profile on top, as everywhere (DEV_SPEC §13.7).
spring:
  main:
    web-application-type: none
    banner-mode: off
margai:
  # The content bucket F8 created on 2026-09-12, with the pipeline's prefixes at its root:
  # source/{ncert,syllabus,pyq}/…, pages/{book}/{lang}/{chapter}/{page}.png,
  # extract/{book}/{lang}.jsonl (DECISIONS 2026-09-12 F8, D14), verify/{book}/{lang}.jsonl
  # (D15, `ncert verify --read-pages`). Credentials come from the SDK's
  # default chain — AWS_PROFILE=margai on the laptop (TECH_PLAN §7.4).
  storage:
    content-bucket: margai-beta-content
  pipeline:
    # 150 DPI puts an A4 page at about 1240×1754 — just under the provider's 1568-pixel long-edge
    # limit, above which it downscales before the model sees the image (§6.1).
    render-dpi: 150
    extract-batch-size: 10
    # Each page is sent as 2 overlapping bands rather than one whole image. The provider shrinks
    # anything over ~1,568 pixels on the long edge and a 150-DPI page is ~1,754, so a whole page
    # arrives already reduced — which is where the D14 audit found every transcription error: a
    # subscript, an exponent, a prime, a minus sign, while the prose around them was perfect.
    # Set to 1 to send whole pages again (the two are directly comparable on the same chapter).
    page-tiles: 2
    # The pair (DECISIONS 2026-09-14): Opus 5 transcribes, Sonnet 5 verifies. `ncert verify --read-pages`
    # refuses to run unless the VISION tier is this model — the `visionsonnet` profile sets it — and a
    # verdict any other model gave is neither reused nor counted.
    verify-model: claude-sonnet-5
    # `ncert embed` commits its vectors every this many paragraphs. Embedding a book is cheap
    # (~900 calls at 0.12 USD/1M tokens) but not free, and a run interrupted late should keep what
    # it paid for — the next run embeds only rows whose embedding is still null.
    embed-batch-size: 100
    # The embedding key is a TRIAL key, capped by the provider at 100 calls/minute — one call per
    # paragraph reaches that in about forty seconds, and the first live run on phy11-part1 died on
    # call 101 of 894 (2026-09-20). Retry cannot rescue a per-minute window: the chain backs off
    # 0.6 s then 1.1 s, which is right for a transient 5xx and useless here, and the provider sends
    # no Retry-After. So the run paces itself instead of being throttled. 90 leaves 10% headroom;
    # a book of ~900 paragraphs then takes about ten minutes.
    # On a production key raise this, or set it to 0 for no pacing at all.
    embed-calls-per-minute: 90
    # `ncert embed --context section` only: below this a paragraph is a fragment and is not
    # embedded. Measured on phy11-part1 — every paragraph under 40 characters is "Answer", a list
    # stub or a stranded equation, and 42 characters is already "All the non-zero digits are
    # significant", which a significant-figures question should be able to find.
    embed-min-characters: 40
  ai:
    # A page transcription is not an answer. The 1,024 default sizes a reasoning answer inside the
    # 20 s budget (§4.11); a full NCERT body page is 400–900 words plus JSON field names, escapes
    # and figure_refs, which lands at or over that on most pages and over it reliably in Biology —
    # and a truncated tool input still parses, so the failure would have been silently short pages
    # (spec-auditor, D14). The provider client now refuses a max_tokens stop outright.
    max-output-tokens: 8192
    # A page image is ~2,800 input tokens and the answer can be long, so give the call room; the
    # default 20 s is sized for a short reasoning answer, not a page.
    call-timeout: 120s
    budget:
      # A pipeline day is not a student day: extracting two pilot books is ~450 VISION calls in
      # one run, against a global-daily-paise placeholder sized for student traffic (₹500). The
      # console workspace spend limit F8 set on 2026-09-12 is the independent backstop; this is
      # the ledger-side one, and it still stops a runaway loop dead (founder ruling, D14).
      global-daily-paise: 200000   # ₹2,000 per IST day for a pipeline run
