# An experiment, not a default: the VISION tier on the reasoning model.
#
#   java -jar server.jar --spring.profiles.active=pipeline,live,visionsonnet ncert extract …
#
# First tried at D14 (2026-09-13) on prompt v1 and closed by RULING 1: 2.2× the cost, and neither
# run loadable — one restarted numbering inside a band, the other filed paragraphs under
# "Example 7.1" as a section. Reopened for ONE measurement on 2026-09-14 (D15, DECISIONS): v3
# takes numbering away from every model, which makes half of that evidence moot, and what remains
# with the model — reading order, box and biography detection, the continue-or-start judgement,
# rule-following — is where the cheap model drifted on the corpus event. So v3's two dry runs,
# phy11-part1 chapter 7 and bio11 chapter 1, run on both models and are read against the same
# defect list. The eight books go on whichever reads cleaner; if equal, the cheap model keeps
# the job and this profile is deleted again.
#
# It is a separate profile, and not merged into `pipeline`, for two reasons: the two configurations
# stay directly comparable on the same chapter, and the VISION tier also serves student photo
# doubts (SPEC §6.3), which must not change model as a side effect of a content-pipeline decision.
#
# The request shape moves with the model (§4.11, DECISIONS 2026-09-12): the reasoning model refuses
# `temperature` outright and takes `effort` instead, and its cacheable prefix is 1,024 tokens
# rather than 4,096. An empty `temperature` binds to null, which is how "send nothing" is spelled.
margai:
  ai:
    tier:
      vision:
        id: claude-sonnet-5
        temperature:
        effort: medium
        thinking: disabled
        cache-min-tokens: 1024
