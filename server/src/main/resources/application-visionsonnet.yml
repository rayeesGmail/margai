# The verify shape: the VISION tier on Claude Sonnet 5, for the second read of the NCERT corpus.
#
#   java -jar server.jar --spring.profiles.active=pipeline,live,visionsonnet ncert verify --read-pages …
#
# Since 2026-09-14 (D15, DECISIONS "the pair") this is how the verifier runs: Claude Opus 5
# transcribes on the `visionopus` shape, and Sonnet 5 reads every transcribed page again with the
# `ncert_verify` prompt. `ncert verify --read-pages` refuses to run when the tier's model is the one
# the ledger says transcribed the rows, so running it without this profile over an Opus corpus fails
# loudly instead of verifying Opus with Opus.
#
# History: first tried at D14 (2026-09-13) as the transcriber and closed by RULING 1 — 2.2× the cost
# and neither run loadable on prompt v1; reopened for one measurement on v3 (2026-09-14), where
# Sonnet was structurally wrong in two full chapter-7 runs of three (a skipped heading, a two-column
# page read right column first) and was the one read of any model to see the vector r that Opus
# wrote `r_hat` four times. A verifier handed one page and a list of paragraphs has no layout to
# get wrong, so the ruling kept it for this job.
#
# It is a separate profile, and not merged into `pipeline`, because the VISION tier also serves
# student photo doubts (SPEC §6.3), which must not change model as a side effect of a
# content-pipeline decision, and because the transcriber's shape (`visionopus`) is the other one.
#
# Request shape (§4.11, DECISIONS 2026-09-12): the model refuses `temperature` outright and takes
# `effort` instead, and its cacheable prefix is 1,024 tokens. An empty `temperature` binds to null,
# which is how "send nothing" is spelled. The tool is forced on every call, so no thinking is emitted
# whatever `effort` says (TRACKER PARKED, dry runs 10 and 11).
margai:
  ai:
    tier:
      vision:
        id: claude-sonnet-5
        temperature:
        effort: medium
        thinking: disabled
        cache-min-tokens: 1024
