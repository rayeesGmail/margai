# An experiment, not a default (D14, 2026-09-13): the VISION tier on the reasoning model.
#
#   java -jar server.jar --spring.profiles.active=pipeline,live,visionsonnet ncert extract …
#
# Why it might be worth twice the price. The D14 equation audit found two kinds of transcription
# error. The first is about pixels — a subscript 1 read as i, a dropped exponent, an inverted
# ratio — and page tiling fixed those, because each band now arrives unscaled. The second kind
# survived tiling and is about *context*: `1` versus `l` in a typeface where they are nearly
# identical (the problem states "Take AG = BG = CG = 1 m" three lines above), a dropped prime that
# turns F'_GB = F_GB into a statement about nothing, a missing leading minus. More pixels cannot
# settle those; reading what the page means might.
#
# It is a separate profile, and not merged into `pipeline`, for two reasons: the two configurations
# stay directly comparable on the same chapter, and the VISION tier also serves student photo
# doubts (SPEC §6.3), which must not change model as a side effect of a content-pipeline decision.
#
# The request shape moves with the model (§4.11, DECISIONS 2026-09-12): the reasoning model refuses
# `temperature` outright and takes `effort` instead, and its cacheable prefix is 1,024 tokens
# rather than 4,096. An empty `temperature` binds to null, which is how "send nothing" is spelled.
margai:
  ai:
    tier:
      vision:
        id: claude-sonnet-5
        temperature:
        effort: medium
        thinking: disabled
        cache-min-tokens: 1024
