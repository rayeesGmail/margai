# MARG AI server — base configuration.
# Local dev targets the compose db (docker-compose.yml). Model IDs, tiers, limits, prices and
# real credentials come from SSM per environment (DEV_SPEC §2.1, §9); nothing secret lives here.
spring:
  application:
    name: margai-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/margai}
    username: ${DB_USER:margai}
    password: ${DB_PASSWORD:margai}   # local compose default only
  jpa:
    hibernate:
      ddl-auto: validate   # schema changes only via Flyway migrations (CLAUDE.md hard rule)
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  jackson:
    # TECH_PLAN §11.3: snake_case on the wire, nulls omitted, unknown input fields ignored.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080

# margai.* binds to @ConfigurationProperties records (TECH_PLAN §11.5). These are the local
# defaults; every key is overridden per environment from SSM through environment variables
# (§7.3, e.g. MARGAI_AI_TIER_CHEAP). Model ids, prices and limits never appear in code.
margai:
  ai:
    # Completion provider (DECISIONS 2026-09-12): direct provider APIs, not a cloud reseller.
    # `bedrock` would make Bedrock the primary, which nothing sets — CS-2 §4.11 keeps it the fallback
    # (below); the setting then needs another fallback provider, or startup refuses.
    provider: anthropic
    # The completion fallback (CS-2 §4.11, TECH_PLAN §15.12): where `margai.flags.ai-fallback` sends
    # completions, with a restart, during an Anthropic outage — never the primary. Each tier names the
    # same model as its primary on Bedrock's global inference profiles, the 5.5 models having no
    # `in.*` profile yet (founder, DECISIONS 2026-10-20); the tier's request shape is the primary's.
    # A fallback id that stops naming its primary is a startup warning (AiConfiguration).
    fallback-provider: bedrock
    fallback:
      tier:
        cheap: global.anthropic.claude-haiku-5-5
        reason: global.anthropic.claude-sonnet-5-5
        vision: global.anthropic.claude-haiku-5-5
    # Tier defaults: the 5.5 models for CHEAP and REASON since 2026-10-20 (D18 T0, founder ruling,
    # DECISIONS: build on the launch models rather than migrate later), in both the real-time and
    # the batch lane, and Haiku 5.5 for VISION too (founder, the same day); pipeline profiles
    # override VISION per run. Each tier
    # also carries the request shape its model accepts (§4.11) — a rejected field is a 400, not a
    # default, so an omitted key means "send nothing". Both 5.5 models reject any `temperature` but
    # 1; Haiku 5.5 turns thinking off with `disabled` (at effort low to high; omitted effort is its
    # default, medium); Sonnet 5.5 answers `disabled` and a forced tool choice with a 400, so it
    # runs `between_tools` with an `auto` tool choice, as measured at D16. `cache-min-tokens` is the
    # model's minimum cacheable prefix: below it a cache point is a silent no-op, and
    # AiConfiguration warns about that at startup.
    tier:
      cheap:
        id: claude-haiku-5-5
        thinking: disabled
        cache-min-tokens: 512
      reason:
        id: claude-sonnet-5-5
        thinking: between_tools   # D23/D39 compare thinking-on on hard numericals before beta
        effort: medium
        tool-choice: auto
        cache-min-tokens: 512
      vision:
        id: claude-haiku-5-5
        thinking: disabled
        cache-min-tokens: 512
    # The embedding pin (§4.9): provider, model and width move together — changing any of them
    # means re-embedding the corpus, so the D17 retrieval harness settles Hindi and Hinglish
    # quality before D16 fills the tables (DECISIONS 2026-09-12).
    embed:
      # Bedrock since 2026-09-20 (DECISIONS): the SAME Cohere model, reached through AWS rather
      # than Cohere's own API, so the pin's meaning and D15's measured result are unchanged. The
      # direct key is a trial key capped at 1,000 calls/month and the corpus needs ~9,000, and no
      # payment method can be attached to that account. Bedrock bills through the AWS account that
      # already pays for S3 and SES, and authenticates by IAM — so there is no second API key to
      # hold or rotate. `cohere` and `embed-v4.0` remain a valid pair if the direct account is
      # ever funded; changing any of provider/model/dimensions re-embeds the corpus (§4.9).
      provider: bedrock
      # An INFERENCE PROFILE, not a bare model id: v4 has no on-demand throughput on Bedrock and
      # refuses with a ValidationException naming the profile (measured 2026-09-20).
      model: global.cohere.embed-v4:0
      dimensions: 1024
      send-output-dimension: true   # v4 answers 1,536 unless asked; the column is vector(1024)
    # Hybrid retrieval (§4.3 stage 6, §4.9). Eight from each half is what the pipeline stage
    # specifies; the rest is what D15's spike exists to settle on one verified book, before nine
    # more are extracted and a change costs a corpus re-embedding.
    retrieval:
      k-vector: 8
      k-text: 8
      # Reciprocal-rank fusion's constant. The halves score on scales that cannot be compared —
      # cosine similarity in 0..1 against an unbounded ts_rank — so they are fused by rank. 60 is
      # the conventional flat setting, which treats the two halves as near-equals.
      rrf-k: 60
      token-cap: 2500
      # Cosine similarity a vector match must clear to count as grounding. No number was ever
      # specified for this; 0.30 is a deliberately permissive opening bid, because at D15 the cost
      # of letting a weak passage through is a line in a report, and the cost of a floor set too
      # high is a grounding failure on a question the corpus can actually answer. The spike's
      # scored run is what moves it.
      similarity-floor: 0.30
    # Keys are the auth model for AI now (§9.2): SSM SecureStrings in a deployed environment,
    # an untracked local file on a laptop, blank here, never a value in this repository.
    anthropic:
      api-key: ""
    cohere:
      api-key: ""
      base-url: https://api.cohere.com
    bedrock:
      region: ap-south-1
    # USD per 1M tokens at direct-API rates (DECISIONS 2026-09-12): cache reads are a tenth of
    # input (a twentieth on Claude Opus 5.5, $0.20 — added with Sonnet 5.5 at D16 from the API
    # reference's price table, cached 2026-09-25 — and on Sonnet 5.5 since its cache-read price was
    # halved to $0.10, read 2026-10-20), a 5-minute cache write 1.25× input — the rate the ledger's
    # single cache_write key means (§4.8) — and every batch token half of on-demand. Claude Haiku
    # 5.5 (D18 T0, read from Anthropic's pricing documentation 2026-10-20) is priced by prompt
    # length: above 100,000 prompt tokens — input, cache read and cache write counted together —
    # the whole call bills at its `long` rates, five times the standard. The embedding rate was confirmed on
    # the provider's own pricing page 2026-09-12 and is the same 0.12 the Bedrock page gave, so no
    # row was ever mispriced. That figure is the model's TEXT rate; the same model charges 0.47 for
    # image tokens, and this table has one input price per model — embedding an image would
    # under-bill ~4×. We send text only (EmbedRequest carries no image); using the model's image
    # side is PARKED as "diagram retrieval with multimodal embeddings" and needs a second price key
    # per model before it bills honestly (§4.9, TRACKER PARKED 2026-09-12). The completion fallback's
    # two Bedrock global profiles carry the Bedrock pricing page's own figures, read by the founder
    # 2026-10-20 (Asia Pacific (Mumbai), global cross-region inference; DECISIONS 2026-10-20): the same
    # as Anthropic's list, the 5-minute cache write the one billed, and no batch rate — the page shows
    # batch as N/A, and the fallback never submits a batch. The long-context row's threshold is not on
    # the page; it is Anthropic's 100,000 prompt tokens.
    prices-json: >-
      {"claude-haiku-4-5":
         {"input": 1.00, "output": 5.00, "cache_read": 0.10, "cache_write": 1.25,
          "batch_input": 0.50, "batch_output": 2.50},
       "claude-sonnet-5":
         {"input": 2.00, "output": 10.00, "cache_read": 0.20, "cache_write": 2.50,
          "batch_input": 1.00, "batch_output": 5.00},
       "claude-opus-5":
         {"input": 5.00, "output": 25.00, "cache_read": 0.50, "cache_write": 6.25,
          "batch_input": 2.50, "batch_output": 12.50},
       "claude-opus-5-5":
         {"input": 4.00, "output": 20.00, "cache_read": 0.20, "cache_write": 5.00,
          "batch_input": 2.00, "batch_output": 10.00},
       "claude-sonnet-5-5":
         {"input": 2.00, "output": 10.00, "cache_read": 0.10, "cache_write": 2.50,
          "batch_input": 1.00, "batch_output": 5.00},
       "claude-haiku-5-5":
         {"input": 0.10, "output": 0.50, "cache_read": 0.01, "cache_write": 0.125,
          "batch_input": 0.05, "batch_output": 0.25,
          "long_above": 100000,
          "long": {"input": 0.50, "output": 2.50, "cache_read": 0.05, "cache_write": 0.625,
                   "batch_input": 0.25, "batch_output": 1.25}},
       "global.anthropic.claude-haiku-5-5":
         {"input": 0.10, "output": 0.50, "cache_read": 0.01, "cache_write": 0.125,
          "long_above": 100000,
          "long": {"input": 0.50, "output": 2.50, "cache_read": 0.05, "cache_write": 0.625}},
       "global.anthropic.claude-sonnet-5-5":
         {"input": 2.00, "output": 10.00, "cache_read": 0.10, "cache_write": 2.50},
       "embed-v4.0":
         {"input": 0.12},
       "global.cohere.embed-v4:0":
         {"input": 0.12}}
    usd-inr: 90
    budget:
      user-daily-paise: 2500      # ₹25 per user per IST day (§4.8)
      global-daily-paise: 50000   # ₹500 across all users per IST day (local placeholder)
    batch-min-records: 100        # below this completeBatch stays on-demand; 0 disables batch (§4.11)
    max-output-tokens: 1024
    call-timeout: 20s             # one real-time model call (§4.11); retries are RetryingAiClient's
    prompts:
      smoke:
        version: 1
      ncert_extract:
        version: 5
      ncert_verify:
        version: 1
      # D18's standalone query-rewrite measurement (DECISIONS 2026-10-19); at D37 the field rides on
      # the doubt router's call.
      query_rewrite:
        version: 1
      # D19: one official booklet page into its questions (VISION; Opus 5.5 at effort low by the
      # founder's ruling, through the `visionopus55` profile at run time).
      pyq_extract:
        version: 1
      # D19: a past-paper question onto its syllabus node (REASON, Sonnet 5.5 batched — the founder's
      # ruling).
      pyq_tag:
        version: 1
  # Object storage (TECH_PLAN §1.3, §7.6; D14). Blank here on purpose: an unconfigured context
  # gets the in-memory store with a WARN, the way an unconfigured context gets FakeAiClient. The
  # pipeline profile names the content bucket, and a deployed environment gets it from SSM.
  storage:
    content-bucket: ""
    region: ap-south-1
  # Auth (TECH_PLAN §3.2, §3.4, §9.1; D7). The two secrets come from SSM as MARGAI_AUTH_JWT_SECRET
  # and MARGAI_AUTH_OTP_PEPPER (base64, 256-bit). Blank → a random value for this process with a
  # WARN at startup (DECISIONS 2026-09-08): right for a laptop, loud anywhere else.
  auth:
    jwt:
      secret: ""
      secret-previous: ""        # accepted while set, during a rotation (§9.2)
      access-ttl: 15m
      refresh-ttl: 30d
    otp:
      pepper: ""
      ttl: 5m
      max-attempts: 5
      resend-cooldown: 30s
      code-length: 6
      channels: [email]          # sms joins when the DLT template (TRACKER F1) exists
      sender: log                # log = sandbox (the code is printed in the server log) | ses
      email-from: ""             # a verified SES identity; required when sender = ses
      ses-region: ap-south-1
      report-every: 1h           # the delivery-rate log line (D11); 1m for a demo
    clock-skew-warn: 2m          # X-Client-Time drift on /auth/* past this is warned and counted (§3.1, D9)
  limits:
    otp-request-per-destination-hourly: 3
    otp-request-per-ip-hourly: 10
    public-auth-per-ip-per-minute: 60   # verify + refresh per client address (§1.5 step 4)
    authenticated-per-minute: 60
  # Feature flags (TECH_PLAN §11.6): booleans, a flip being a config change and a task restart.
  flags:
    # Completions to margai.ai.fallback-provider during an Anthropic outage (TECH_PLAN §15.12); the
    # D70 drill exercises it, and it is ready only after the founder's smoke (DECISIONS 2026-10-20).
    ai-fallback: false

# health is public (the ALB check, component names only); metrics is the founder's raw view of every
# Micrometer counter until CloudWatch (F8/D73) and needs an admin bearer — the security chain gates
# /actuator/** beyond health on role = admin (D11, DECISIONS; amends the D2 "only health" row).
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-components: always
