# Server-side copy, English (TECH_PLAN §3.3, §11.7). Keys are error codes and message kinds; the
# same strings key the app's ARB files. Mentor voice: warm, direct, never guilt-tripping.
# MessageFormat applies when arguments are passed: double any apostrophe in those entries.

VALIDATION_FAILED=Some details don''t look right. Have a look and try again.
AUTH_REQUIRED=Please sign in to continue.
AUTH_EXPIRED=Your session needs a quick refresh.
AUTH_INVALID=Please sign in again.
OTP_INVALID=That code didn''t match. Try once more.
OTP_EXPIRED=That code isn''t valid any more. Ask for a new one.
FORBIDDEN=You can''t do that here.
NOT_FOUND=We couldn''t find that.
RATE_LIMITED=A little too fast. Try again in a moment.
OTP_RATE_LIMITED=Too many codes requested. Give it a little time.
INTERNAL=Something went wrong on our side. Please try again.
IMAGE_UNREADABLE=We couldn''t read that photo. Try again in better light.
IDEMPOTENCY_CONFLICT=That request was already made with different details.
CONSENT_REQUIRED=This needs a parent''s consent first.
PRO_REQUIRED=This one is part of Pro.
STATE_CONFLICT=That step doesn''t fit where you are right now.
DOUBT_LIMIT_REACHED=You''ve used today''s free solves.
DOUBT_UNVERIFIED=We couldn''t verify this answer, so we won''t show it. A human will check it.
NOT_A_QUESTION=We couldn''t find a question in that photo.
AI_UNAVAILABLE=We couldn''t solve this right now. Please try again in a bit.
AI_BUDGET_EXCEEDED=You''ve done a lot today — this will be answered a little later.

