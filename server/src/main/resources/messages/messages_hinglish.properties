VALIDATION_FAILED=Kuch details sahi nahi lag rahi. Ek baar dekh kar phir try karo.
AUTH_REQUIRED=Continue karne ke liye sign in karo.
AUTH_EXPIRED=Session ko ek chhota refresh chahiye.
AUTH_INVALID=Please dobara sign in karo.
OTP_INVALID=Code match nahi hua. Ek baar aur try karo.
OTP_EXPIRED=Yeh code ab valid nahi hai. Naya code mangao.
FORBIDDEN=Yeh yahan allowed nahi hai.
NOT_FOUND=Yeh humein nahi mila.
RATE_LIMITED=Thoda tez ho gaya. Ek pal baad phir try karo.
OTP_RATE_LIMITED=Bahut saare codes maange gaye. Thoda wait karo.
INTERNAL=Hamari taraf se kuch gadbad hui. Please phir try karo.
IMAGE_UNREADABLE=Yeh photo padh nahi paaye. Behtar roshni mein phir try karo.
IDEMPOTENCY_CONFLICT=Yeh request pehle hi alag details ke saath ho chuki hai.
CONSENT_REQUIRED=Iske liye pehle parent ki consent chahiye.
PRO_REQUIRED=Yeh feature Pro ka hissa hai.
STATE_CONFLICT=Yeh step abhi aapki situation se match nahi karta.
DOUBT_LIMIT_REACHED=Aaj ke free solves ho gaye.
DOUBT_UNVERIFIED=Hum is answer ko verify nahi kar paaye, isliye dikhayenge nahi. Ek insaan ise check karega.
NOT_A_QUESTION=Is photo mein humein koi sawaal nahi mila.
AI_UNAVAILABLE=Abhi hum ise solve nahi kar paaye. Thodi der baad phir try karo.
AI_BUDGET_EXCEEDED=Aaj aapne bahut kaam kiya — iska jawab thodi der baad milega.

